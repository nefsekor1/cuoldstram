name: CloudStream TR Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kaynak Kodları Çek (src)
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Derleme Dalını Çek (builds)
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Android Lisanslarını Kabul Et
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Eklentileri Derle (.cs3 & plugins.json)
        run: |
          set -e -o pipefail
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace --no-daemon 2>&1 | tee $GITHUB_WORKSPACE/build.log
          echo "=== TÜM CS3 DOSYALARI ==="
          find $GITHUB_WORKSPACE/src -name "*.cs3"
          mkdir -p $GITHUB_WORKSPACE/builds
          find $GITHUB_WORKSPACE/src -name "*.cs3" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          [ -f $GITHUB_WORKSPACE/src/build/plugins.json ] && cp -v $GITHUB_WORKSPACE/src/build/plugins.json $GITHUB_WORKSPACE/builds/ || true
          [ -f $GITHUB_WORKSPACE/src/plugins.json ] && cp -v $GITHUB_WORKSPACE/src/plugins.json $GITHUB_WORKSPACE/builds/ || true
          [ -f $GITHUB_WORKSPACE/src/plugins-v2.json ] && cp -v $GITHUB_WORKSPACE/src/plugins-v2.json $GITHUB_WORKSPACE/builds/ || true
          [ -f $GITHUB_WORKSPACE/src/plugins-v3.json ] && cp -v $GITHUB_WORKSPACE/src/plugins-v3.json $GITHUB_WORKSPACE/builds/ || true
          [ -f $GITHUB_WORKSPACE/src/repo.json ] && cp -v $GITHUB_WORKSPACE/src/repo.json $GITHUB_WORKSPACE/builds/ || true
          echo "=== BUILDS KLASÖRÜNDEKİ DOSYALAR ==="
          ls -la $GITHUB_WORKSPACE/builds

      - name: Derlemeleri ve Günlüğü 'builds' Dalına Yükle
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          cp -f $GITHUB_WORKSPACE/build.log ./build.log || true
          git add -A
          git commit -m "Derleme Tamamlandi: $GITHUB_SHA" || exit 0
          git push origin builds --force

      - name: jsDelivr Ön Belleğini Temizle (Purge CDN Cache)
        if: success()
        run: |
          sleep 2
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@master/repo.json" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/repo.json" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/plugins.json" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/plugins-v2.json" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/plugins-v3.json" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/HDFilmCehennemi.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/DiziBox.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/FilmMakinesi.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/CanliTV.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/FilmModu.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/nefsekor1/cuoldstram@builds/TurkAnime.cs3" || true
