name: CloudStream TR Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kaynak Kodları Çek (src)
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: Derleme Dalını Çek (builds)
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Eski Derlemeleri Temizle
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Eklentileri Derle (.cs3 & plugins.json)
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ || true

      - name: Derlemeleri 'builds' Dalına Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          git add -A
          git commit -m "Otomatik Derleme: $GITHUB_SHA" || exit 0
          git push origin builds --force
