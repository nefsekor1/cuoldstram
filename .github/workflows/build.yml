name: CloudStream TR Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kaynak Kodları Çek (src)
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Derleme Dalını Çek (builds)
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Eski Derlemeleri Temizle
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Android Lisanslarını Kabul Et
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Eklentileri Derle (.cs3 & plugins.json)
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace --no-daemon
          mkdir -p $GITHUB_WORKSPACE/builds
          find . -name "*.cs3" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          cp -v build/plugins.json $GITHUB_WORKSPACE/builds/ || true

      - name: Derlemeleri 'builds' Dalına Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          git add -A
          git commit -m "Otomatik Derleme: $GITHUB_SHA" || exit 0
          git push origin builds --force
